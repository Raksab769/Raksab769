<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>

<!-- card background -->
<rect width="480" height="460" rx="12" fill="url(#ibg)"/>
<rect x="0.5" y="0.5" width="479" height="459" rx="12" fill="none" stroke="#30363d"/>

<!-- title bar -->
<line x1="0" y1="30" x2="480" y2="30" stroke="#30363d"/>

<text x="240" y="19" fill="#7d8590" font-size="12" text-anchor="middle">baskars@github: ~$ neofetch</text>

<!-- ── ROW 0: identity header ── -->
<g opacity="0" transform="translate(0,5)">
  <text x="20" y="60" font-size="14" font-weight="700">
    <tspan fill="#3fb950">baskars</tspan>
    <tspan fill="#7d8590">@</tspan>
    <tspan fill="#22d3ee">github</tspan>
  </text>
  <line x1="178" y1="56" x2="460" y2="56" stroke="#30363d" stroke-opacity="0.8"/>
  <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.4s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.15s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</g>

<!-- ── ROW 2: Role ── -->
<g opacity="0" transform="translate(0,5)">
  <text x="20" y="104" fill="#ffa657" font-size="12.5" font-weight="700">Role</text>
